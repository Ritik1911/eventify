
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | Eventify</title>
    <meta name="description" content="Eventify: discover and book college workshops, seminars, hackathons and competitions.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b5cf6'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div id="site-header"></div>

<main>
    <section class="auth">
        <form class="glass auth-card wide"
              data-validate
              method="POST"
              action="{{ url_for('register') }}">

            <h1>Create your account</h1>
            <p>Join Eventify with your college details.</p>

            <div class="form-row">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" required autocomplete="name">
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" data-rule="email" required autocomplete="email">
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="mobile">Mobile number</label>
                    <input id="mobile" name="mobile" type="tel" data-rule="mobile" required placeholder="10-digit number">
                </div>

                <div class="field">
                    <label for="college">College name</label>
                    <input id="college" name="college" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="dept">Department</label>
                    <select id="dept" name="department" required>
                        <option value="">Select department</option>
                        <option>Computer Engineering</option>
                        <option>Information Technology</option>
                        <option>Electronics & Communication</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                        <option>Electrical Engineering</option>
                    </select>
                </div>

                <div class="field">
                    <label for="sem">Semester</label>
                    <select id="sem" name="semester" required>
                        <option value="">Select semester</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label for="password">Password</label>
                    <div class="pw">
                        <input id="password" name="password" type="password"
                               data-rule="password" required
                               autocomplete="new-password"
                               placeholder="At least 8 characters">
                        <button type="button" data-toggle-pw="password">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <div class="pw">
                        <input id="confirm" name="confirm" type="password"
                               data-match="password" required
                               autocomplete="new-password">
                        <button type="button" data-toggle-pw="confirm">Show</button>
                    </div>
                </div>
            </div>

            <label class="check">
                <input type="checkbox" name="terms" required>
                I agree to the Terms and Conditions and Privacy Policy.
            </label>

            <button class="btn btn-primary btn-block" type="submit">
                Create account
            </button>

            <p class="alt">
                Already registered?
                <a href="{{ url_for('login') }}">Log in</a>
            </p>

        </form>
    </section>
</main>

<div id="site-footer"></div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
