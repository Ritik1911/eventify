
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Eventify</title>

    <meta name="description" content="Eventify: discover and book college workshops, seminars, hackathons and competitions.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238b5cf6'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">

    <!-- Flask CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div id="site-header"></div>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div id="toasts" aria-live="polite">
    {% for category, message in messages %}
    <div class="toast {{ category }}">{{ message }}</div>
    {% endfor %}
</div>
<script>setTimeout(function(){document.querySelectorAll("#toasts .toast").forEach(function(t){t.remove()})},7000);</script>
{% endif %}
{% endwith %}

<main>

    <!-- LOGIN SECTION -->
    <section class="auth">

        <form
            class="glass auth-card"
            data-validate
            method="POST"
            action="{{ url_for('login') }}"
        >

            <h1>Welcome back</h1>

            <p>
                Log in to book events and manage registrations.
            </p>

            <!-- EMAIL -->
            <div class="field">

                <label for="email">Email address</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    data-rule="email"
                    required
                    autocomplete="email"
                    placeholder="you@college.edu"
                >

            </div>

            <!-- PASSWORD -->
            <div class="field">

                <label for="password">Password</label>

                <div class="pw">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        placeholder="Your password"
                    >

                    <button
                        type="button"
                        data-toggle-pw="password"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- REMEMBER ME -->
            <div class="between">

                <label class="check">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>

                <a
                    class="link"
                    href="#"
                    data-soon="Password reset will work once the backend is connected."
                >
                    Forgot password?
                </a>

            </div>

            <!-- LOGIN BUTTON -->
            <button
                class="btn btn-primary btn-block"
                type="submit"
            >
                Log in
            </button>

            <!-- REGISTER REDIRECT -->
            <p class="alt">

                New to Eventify?

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>

            </p>

        </form>

    </section>

</main>

<div id="site-footer"></div>

<!-- Flask JavaScript -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
